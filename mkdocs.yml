site_name: Fourier Studio
site_description: Interactive 2D Fourier Transform learning and experimentation platform
site_url: https://kareem-taha-05.github.io/Fourier-Studio
repo_url: https://github.com/Kareem-Taha-05/Fourier-Studio
repo_name: Kareem-Taha-05/Fourier-Studio
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  font:
    text: Share Tech Mono
    code: Share Tech Mono
  logo: assets/branding/logo.png
  favicon: assets/branding/logo.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - toc.follow

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting Started:
    - Installation: installation.md
    - Quickstart: quickstart.md
  - User Guide:
    - Overview: usage.md
  - Architecture: architecture.md
  - API Reference:
    - Images: api/images.md
    - Mixer: api/mixer.md
    - Emphasizer: api/emphasizer.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Kareem-Taha-05/Fourier-Studio
