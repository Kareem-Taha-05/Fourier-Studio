site_name: FREQWAVE
site_description: Interactive 2D Fourier Transform learning and experimentation platform
site_url: https://YOUR_USERNAME.github.io/freqwave
repo_url: https://github.com/YOUR_USERNAME/freqwave
repo_name: YOUR_USERNAME/freqwave
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    # Dark mode (default — matches the app)
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    # Light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  font:
    text: Share Tech Mono
    code: Share Tech Mono
  logo: assets/branding/logo.svg
  favicon: assets/branding/logo.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - toc.follow

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting Started:
    - Installation: installation.md
    - Quickstart: quickstart.md
  - User Guide:
    - Overview: usage.md
    - FT Mixer (Part A): usage.md#part-a--ft-mixer
    - FT Emphasizer (Part B): usage.md#part-b--ft-emphasizer
  - Architecture: architecture.md
  - API Reference:
    - Images: api/images.md
    - Mixer: api/mixer.md
    - Emphasizer: api/emphasizer.md
  - Contributing: ../CONTRIBUTING.md
  - Changelog: ../CHANGELOG.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [backend]

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/YOUR_USERNAME/freqwave
  version:
    provider: mike
