name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Verify backend imports
        run: |
          cd backend
          python -c "from app.main import app; print('Backend OK')"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-app/package-lock.json

      - name: Build frontend
        run: |
          cd frontend-app
          npm ci
          npm run build

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Extract changelog entry
        id: changelog
        run: |
          python3 - <<'PYEOF'
          import re, os
          with open("CHANGELOG.md") as f:
              content = f.read()
          # Extract the first versioned section
          match = re.search(r"## \[\d+\.\d+\.\d+\].*?\n(.*?)(?=\n## \[|\Z)", content, re.DOTALL)
          notes = match.group(1).strip() if match else "See CHANGELOG.md for details."
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"NOTES<<EOF\n{notes}\nEOF\n")
          PYEOF

      - name: Create release archive
        run: |
          zip -r freqwave-${{ steps.version.outputs.VERSION }}.zip \
            backend/ frontend-app/src/ frontend-app/package.json \
            frontend-app/vite.config.js README.md LICENSE CHANGELOG.md \
            --exclude "*/node_modules/*" --exclude "*/__pycache__/*" \
            --exclude "*/.venv/*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: FREQWAVE v${{ steps.version.outputs.VERSION }}
          body: ${{ steps.changelog.outputs.NOTES }}
          files: freqwave-${{ steps.version.outputs.VERSION }}.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
