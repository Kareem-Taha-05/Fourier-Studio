[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "fourier-studio"
version = "1.0.0"
description = "Interactive 2D Fourier Transform learning and experimentation platform"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "Fourier Studio Contributors" },
]
keywords = [
  "fourier-transform", "dft", "fft", "image-processing",
  "signal-processing", "education", "fastapi", "react",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Framework :: FastAPI",
]
dependencies = [
  "fastapi==0.111.0",
  "uvicorn[standard]==0.30.1",
  "python-multipart==0.0.9",
  "Pillow==10.3.0",
  "numpy==1.26.4",
  "scipy==1.13.0",
  "pydantic==2.7.1",
  "pydantic-settings==2.3.0",
  "python-jose==3.3.0",
  "aiofiles==23.2.1",
]

[project.urls]
Homepage      = "https://kareem-taha-05.github.io/Fourier-Studio"
Repository    = "https://github.com/Kareem-Taha-05/Fourier-Studio"
Documentation = "https://kareem-taha-05.github.io/Fourier-Studio"
"Bug Tracker" = "https://github.com/Kareem-Taha-05/Fourier-Studio/issues"
Changelog     = "https://github.com/Kareem-Taha-05/Fourier-Studio/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths    = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
